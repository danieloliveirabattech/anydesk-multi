[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anydesk-multi"
version = "0.2.1"
description = "Roda várias instâncias isoladas do AnyDesk em paralelo (Windows)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "odan" }]
keywords = ["anydesk", "remote-desktop", "windows", "multi-instance"]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]

[project.urls]
Homepage = "https://github.com/danieloliveirabattech/anydesk-multi"

[project.scripts]
anydesk-multi = "anydesk_multi.cli:main"

[project.gui-scripts]
anydesk-multi-gui = "anydesk_multi.gui:main"

[tool.setuptools]
packages = ["anydesk_multi"]
include-package-data = true

[tool.setuptools.package-data]
anydesk_multi = ["vendor/*.exe", "assets/*.ico", "assets/*.png"]
