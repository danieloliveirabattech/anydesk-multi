name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil "PyQt6>=6.6"

      - name: Compilar executável (onefile)
        run: pyinstaller --noconfirm --onefile --windowed --name AnyDeskMulti --add-data "anydesk_multi/vendor/AnyDesk.exe;anydesk_multi/vendor" app.py

      - name: Publicar na Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyDeskMulti.exe
          generate_release_notes: true
